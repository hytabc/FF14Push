# 前端容器：静态资源 + 反向代理后端 API（前后端同源，因此无需 CORS 配置）
#
# 使用 Docker 内置 DNS 解析后端服务名，并把解析结果延迟到请求时，
# 这样即使后端容器比 nginx 晚就绪，前端也不会启动失败。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 4m;

    set $backend "http://backend:8000";

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_http_version 1.1;
    # 关键：默认 gzip_proxied=off 会让 /api/ 的反代响应完全不被压缩，
    # 后端虽有 GZipMiddleware 兜底，这里也显式开启，避免大响应（如 /game/state）裸传。
    gzip_proxied any;

    # 容器健康检查（不依赖后端）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 带内容哈希的构建产物可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # WebSocket：除 Upgrade/Connection 外，nginx 默认会把客户端的
    # `Sec-WebSocket-Extensions` 透传给后端、并把 101 的协商结果透传回来，
    # 因此 uvicorn 的 permessage-deflate（按消息压缩）在此反代下可直接生效。
    # 验证：浏览器 devtools → 该 WS 连接的握手响应应含 `Sec-WebSocket-Extensions: permessage-deflate`。
    # 若上游/中间层剥离了该头，可显式补 `proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;`。

    location /api/v1/coop/ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
    }

    # 聊天室 / 世界BOSS 的 WebSocket：必须同样带 Upgrade，否则会被下面 /api/ 的
    # Connection "" 破坏握手（这两个路径此前缺少独立 location）。
    location /api/v1/chat/ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
    }

    location /api/v1/worldboss/ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
    }

    # 后端 API
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # 供外部监控直接探活后端
    location = /health {
        proxy_pass $backend/health;
        proxy_set_header Host $host;
    }

    # 单页应用：未命中的路径回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
