services:
  db:
    image: postgres:16-alpine
    container_name: eorzea-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eorzea
      POSTGRES_PASSWORD: eorzea
      POSTGRES_DB: eorzea
    ports:
      - "5432:5432"
    volumes:
      - eorzea_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eorzea -d eorzea"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eorzea_pgdata:
