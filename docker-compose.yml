# 服务器部署编排（PostgreSQL + FastAPI + Nginx 静态站点）
#
#   1. cp .env.example .env   并按需修改端口 / 密码 / JWT 密钥
#   2. docker compose up -d --build
#   3. 访问 http://<服务器地址>:${FRONTEND_PORT}
#
# 所有对外端口都在 .env 中配置。
#
# 国内部署：基础镜像与 pip / npm / apt 源默认走国内镜像，
# 可在 .env 中通过 DOCKER_IMAGE_MIRROR / PIP_INDEX_URL / NPM_REGISTRY / APT_MIRROR 覆盖。

name: eorzea-idle-chronicle

services:
  db:
    image: ${DOCKER_IMAGE_MIRROR-docker.m.daocloud.io/library/}postgres:16-alpine
    restart: unless-stopped
    # 小内存服务器（2 GB）上的保守参数：
    #   effective_cache_size 默认 4GB 会误导 planner 选择不适合小机器的计划；这里按实际内存下调。
    #   work_mem 是「每个排序/哈希节点」的内存，并发下会乘算，保持 4MB 不宜再大。
    #   max_connections 与各进程连接池总上限对齐（见下面 backend / worker 的 DB_POOL_PROFILE）。
    #   shm_size 供 Postgres 并行查询与大排序使用（容器默认 /dev/shm 仅 64MB）。
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
    shm_size: 128m
    mem_limit: 640m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eorzea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-eorzea}
    volumes:
      # 数据库文件映射到本机目录（实例重建 / 更新不会丢数据）。
      # 路径可用 .env 中的 POSTGRES_DATA_DIR 覆盖，默认仓库内 ./data/postgres。
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    ports:
      # 默认只绑定本机，不对外暴露数据库。
      # 如需远程连接，把 127.0.0.1 改为 0.0.0.0（并确保防火墙与强密码）。
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eorzea} -d ${POSTGRES_DB:-eorzea}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [eorzea]

  db-backup:
    # 定时备份：每 BACKUP_INTERVAL_HOURS 小时把数据库导出为 tar.gz 压缩包，
    # 只保留最近 BACKUP_KEEP 份；产物落在宿主机 ${BACKUP_DIR}（默认 ./data/backups）。
    image: ${DOCKER_IMAGE_MIRROR-docker.m.daocloud.io/library/}postgres:16-alpine
    restart: unless-stopped
    mem_limit: 128m
    environment:
      # pg_dump 连接参数（与 db 服务一致）。
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-eorzea}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-eorzea}
      # 容器内备份目录固定挂载到 /backups（与上面 volumes 的宿主机路径无关）。
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-12}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-eorzea}
    volumes:
      - ${BACKUP_DIR:-./data/backups}:/backups
      - ./scripts/db-backup.sh:/usr/local/bin/db-backup.sh:ro
    entrypoint: ["sh", "/usr/local/bin/db-backup.sh"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    networks: [eorzea]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTHON_IMAGE: ${DOCKER_IMAGE_MIRROR-docker.m.daocloud.io/library/}python:3.12-slim
        APT_MIRROR: ${APT_MIRROR-mirrors.tuna.tsinghua.edu.cn}
        PIP_INDEX_URL: ${PIP_INDEX_URL-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: eorzea-backend:latest
    restart: unless-stopped
    environment: &backend-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-eorzea}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-eorzea}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      REPORT_TOLERANCE: ${REPORT_TOLERANCE:-1.10}
      # 兑换码：留空即关闭该功能；每个账号对同一兑换码只能兑换一次
      REDEEM_CODE: ${REDEEM_CODE:-}
      REDEEM_GOLD: ${REDEEM_GOLD:-0}
      # 管理员：留空 ADMIN_PASSWORD 即不启用；管理员不参与排行榜
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 迁移由容器入口脚本执行，避免与 alembic 冲突
      AUTO_CREATE_TABLES: "false"
      BACKEND_PORT: "8000"
      # 并发降载：uvicorn 工作进程数。2 GB 内存下默认 1 个（单进程 asyncio 足够处理 I/O 型挂机请求，
      # 且省下一份 CONFIG + 连接池）；若压测确认 CPU 才是瓶颈，可设 UVICORN_WORKERS=2。
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      # 数据库连接池按进程角色分档：API 用 5+5，worker 进程（DB_POOL_PROFILE=worker）用 2+0，
      # 使「进程数 × 连接上限」远低于 db 的 max_connections(40)。
      DB_POOL_PROFILE: ${DB_POOL_PROFILE:-api}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      # 排行榜改由独立 ranking-worker 刷新（见下方服务），API 进程内不再跑。
      RANKING_IN_API: "false"
      # 缓存榜刷新间隔（秒）与实时榜（钓鱼/生活/远征）进程内缓存秒数。
      RANKING_REFRESH_SECONDS: ${RANKING_REFRESH_SECONDS:-600}
      RANKING_LIVE_CACHE_SECONDS: ${RANKING_LIVE_CACHE_SECONDS:-10}
      # 世界BOSS 全局时间兜底轮询是否留在 API 内：专用 worldboss-worker 已承担，默认关闭。
      WORLDBOSS_LOOP_IN_API: "false"
      # 数据保留清理：只清「终态 + 超期」的历史行；榜单真相与反多开判定依据永不清理。
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS:-3600}
      RETENTION_SESSIONS_DAYS: ${RETENTION_SESSIONS_DAYS:-7}
      RETENTION_COOP_DAYS: ${RETENTION_COOP_DAYS:-7}
      RETENTION_PVP_DAYS: ${RETENTION_PVP_DAYS:-30}
      RETENTION_AUDIT_DAYS: ${RETENTION_AUDIT_DAYS:-30}
      RETENTION_RATELIMIT_DAYS: ${RETENTION_RATELIMIT_DAYS:-2}
      # 响应体压缩（直连 API 时生效；nginx 侧已单独开启）。
      GZIP_ENABLED: ${GZIP_ENABLED:-true}
      # 传输层：响应 brotli（客户端支持 br 时优先，gzip 兜底）+ 请求体 gzip 解压。
      BROTLI_ENABLED: ${BROTLI_ENABLED:-true}
      REQUEST_DECOMPRESS_ENABLED: ${REQUEST_DECOMPRESS_ENABLED:-true}
      REQUEST_MAX_DECOMPRESSED_BYTES: ${REQUEST_MAX_DECOMPRESSED_BYTES:-8388608}
      # 世界BOSS 客户端上报的伤害上限容差（越大越宽松）。
      WORLDBOSS_REPORT_TOLERANCE: ${WORLDBOSS_REPORT_TOLERANCE:-1.15}
    ports:
      # 默认只绑定本机；前端已通过 nginx 反向代理 /api，通常无需对外暴露。
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    mem_limit: 384m
    depends_on:
      db:
        condition: service_healthy
    networks: [eorzea]

  coop-worker:
    image: eorzea-backend:latest
    restart: unless-stopped
    # DB_POOL_PROFILE=worker：worker 进程只需 2 条连接，避免「进程数 × 连接池」超过 max_connections。
    entrypoint: ["env", "DB_POOL_PROFILE=worker", "python", "-m", "app.coop_worker"]
    environment: *backend-environment
    mem_limit: 256m
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy
    networks: [eorzea]

  worldboss-worker:
    image: eorzea-backend:latest
    restart: unless-stopped
    entrypoint: ["env", "DB_POOL_PROFILE=worker", "python", "-m", "app.worldboss_worker"]
    environment: *backend-environment
    mem_limit: 192m
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy
    networks: [eorzea]

  ranking-worker:
    # 排行榜缓存榜刷新：独立进程，避免全量重算（所有用户 + 已装备 + 全表重写）与请求处理互相影响。
    # 多实例由 PostgreSQL advisory lock 互斥（见 services/locks.py）。
    # 该进程同时承担「数据保留清理」（services/retention.py），故内存上限留得比其它 worker 宽。
    image: eorzea-backend:latest
    restart: unless-stopped
    entrypoint: ["env", "DB_POOL_PROFILE=worker", "python", "-m", "app.ranking_worker"]
    environment: *backend-environment
    mem_limit: 384m
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy
    networks: [eorzea]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NODE_IMAGE: ${DOCKER_IMAGE_MIRROR-docker.m.daocloud.io/library/}node:22-alpine
        NGINX_IMAGE: ${DOCKER_IMAGE_MIRROR-docker.m.daocloud.io/library/}nginx:1.27-alpine
        NPM_REGISTRY: ${NPM_REGISTRY-https://registry.npmmirror.com}
        VITE_API_BASE: /api/v1
    image: eorzea-frontend:latest
    restart: unless-stopped
    mem_limit: 64m
    ports:
      # 唯一需要公网开放的端口
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started
    networks: [eorzea]

networks:
  eorzea:
    driver: bridge
